<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Rune Clash</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0b0f">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:flex;align-items:center;justify-content:center;padding:24px;
    font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    color:#ece6dc;background:#0d0b0f;
    background-image:radial-gradient(70% 55% at 50% 0,rgba(217,181,108,.16),transparent 70%);
    text-align:center;
  }
  main{max-width:460px}
  .rune{font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:#d9b56c;margin:0 0 22px}
  h1{margin:0;font-size:clamp(56px,16vw,104px);line-height:.9;font-weight:800;letter-spacing:-.02em;
     background:linear-gradient(180deg,#fff,#e8cb92 55%,#b98f3e);-webkit-background-clip:text;background-clip:text;color:transparent}
  h2{margin:14px 0 10px;font-size:21px;font-weight:700}
  p{margin:0 0 28px;color:#a9a496}
  .liens{display:flex;flex-direction:column;gap:12px}
  a{display:block;padding:15px 22px;border-radius:12px;text-decoration:none;font-weight:700;font-size:16px}
  .prime{color:#1d1406;background:linear-gradient(180deg,#f0d79a,#d9b56c 55%,#b98f3e);box-shadow:0 8px 24px rgba(217,181,108,.22)}
  .second{color:#ece6dc;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04)}
  a:hover{filter:brightness(1.06)}
  a:focus-visible{outline:3px solid #d9b56c;outline-offset:3px}
  small{display:block;margin-top:26px;color:#6f6b62;font-size:13px}
  small a{display:inline;padding:0;color:#a9a496;font-weight:400;text-decoration:underline}
</style>
</head>
<body>
<main>
  <p class="rune">Rune Clash</p>
  <h1>404</h1>
  <h2>Cette page n'existe pas</h2>
  <p>Le lien est peut-être ancien, ou l'adresse comporte une faute. Le jeu, lui, est toujours là.</p>
  <div class="liens">
    <a class="prime" href="/">Jouer maintenant</a>
    <a class="second" href="/site/">Découvrir le jeu</a>
  </div>
  <small>Un lien cassé sur le site ? <a href="/site/#conseils">Signale-le ici</a>.</small>
</main>
</body>
</html>
